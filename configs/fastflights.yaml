# fast-flights: unofficial Google Flights scraper (faster-flights library). No key, no quota,
# but it can break when Google changes its pages or blocks requests.
# Airports, dates and price limit come from trip.yaml.
name: fast-flights
provider: fastflights
# When the cron-job.org timer runs this bot (cron syntax, UTC). Only used to show
# the next check time in Telegram, so keep it in sync with the timer.
schedule: "0 * * * *"          # every hour, on the hour
state_file: state/fastflights.json

# No max_searches_per_run: every date is checked on every run (one request per airport
# per date). If Google starts blocking, add under `search:` e.g. `max_searches_per_run: 45`
# to check 5 dates per run instead.

status_message: true
dates_per_message: 5           # one status message per 5 dates (13 dates = 3 messages per run)
