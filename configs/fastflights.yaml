# fast-flights: unofficial Google Flights scraper (faster-flights library). No key, no quota,
# but it can break when Google changes its pages or blocks requests.
name: fast-flights
provider: fastflights
schedule: "47 * * * *"         # every hour (UTC); the cron-job.org timer must match (used for the "next check" time)
state_file: state/fastflights.json

search:
  origins: [BGO]               # Bergen
  destinations:
    - GRU                      # São Paulo Guarulhos
    - GIG                      # Rio de Janeiro Galeão
    - VCP                      # Campinas Viracopos
    - FOR                      # Fortaleza
    - REC                      # Recife
    - SSA                      # Salvador
    - BSB                      # Brasília
    - CNF                      # Belo Horizonte Confins
    - POA                      # Porto Alegre
  departure_dates:
    from: 2026-12-10
    to: 2026-12-22

  return_after_days: null      # one-way

  adults: 1
  cabin_class: economy         # economy | premium_economy | business | first
  max_connections: 1           # 0 = direct only

  # No max_searches_per_run: every date is checked on every run.
  # (Each date is one request per airport, so 13 dates x 9 airports = 117 requests/hour.
  #  If Google starts blocking, add e.g. `max_searches_per_run: 45` to check 5 dates per run.)

alert:
  currency: NOK
  max_price: 8000

status_message: true
dates_per_message: 5           # one status message per 5 dates (13 dates = 3 messages per run)
timezone: Europe/Oslo
