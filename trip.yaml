# Trip settings shared by every bot in configs/. Edit your airports, dates and
# price limit here. A bot's own config file can still override any of these.
search:
  origins: [BGO]               # Bergen
  destinations:
    - GRU                      # São Paulo Guarulhos
    - GIG                      # Rio de Janeiro Galeão
    - VCP                      # Campinas Viracopos
    - FOR                      # Fortaleza
    - REC                      # Recife
    - SSA                      # Salvador
    - BSB                      # Brasília
    - CNF                      # Belo Horizonte Confins
    - POA                      # Porto Alegre
  departure_dates:             # either a range (every day from..to, both included)...
    from: 2026-12-10
    to: 2026-12-22
  # ...or an explicit list:
  # departure_dates: [2026-12-15, 2026-12-18]

  # Round trip: return N days after departure. Can be a list, e.g. [14, 21].
  # Leave null for one-way.
  return_after_days: null

  adults: 1
  cabin_class: economy         # economy | premium_economy | business | first
  max_connections: 2           # 0 = direct only

alert:
  currency: NOK
  max_price: 8000              # alert when the cheapest fare is at or below this

timezone: Europe/Oslo          # for times shown in Telegram messages
