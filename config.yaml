# Every origin x destination x date combination is searched on each run.
# Here: 1 x 9 x 13 = 117 searches per run.
search:
  origins: [BGO]               # Bergen
  destinations:
    - GRU                      # São Paulo Guarulhos
    - GIG                      # Rio de Janeiro Galeão
    - VCP                      # Campinas Viracopos
    - FOR                      # Fortaleza
    - REC                      # Recife
    - SSA                      # Salvador
    - BSB                      # Brasília
    - CNF                      # Belo Horizonte Confins
    - POA                      # Porto Alegre
  departure_dates:             # either a range...
    from: 2026-12-10
    to: 2026-12-22
  # ...or an explicit list:
  # departure_dates: [2026-12-15, 2026-12-18]

  # Round trip: return N days after departure. Can be a list, e.g. [14, 21].
  # Leave unset (or null) for one-way.
  return_after_days: null

  adults: 1
  cabin_class: economy         # economy | premium_economy | business | first
  max_connections: 1           # 0 = direct only

alert:
  # Alert when the cheapest fare is at or below the limit for its currency.
  # Airlines price in different currencies; EUR/USD are rough equivalents of 8000 NOK.
  max_price:
    NOK: 8000
    EUR: 690
    USD: 790
