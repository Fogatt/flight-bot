name: Check flights

on:
  schedule:
    # Each cron runs the configs in configs/ whose `schedule` matches it exactly. 
    - cron: "17 */8 * * *"   # SerpApi, every 8 hours (UTC)
    - cron: "47 * * * *"     # fast-flights, every hour
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      config:
        description: Which bot to run
        type: choice
        options: [all, serpapi, fastflights]
        default: all

permissions:
  contents: write             # to commit state files back

concurrency:
  # One queue per schedule, so an hourly run never cancels a waiting 8-hourly one.
  group: check-flights-${{ github.event.schedule || inputs.config }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Always use the latest main, even when re-running an old run,
          # so we start from the newest state files.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search fares
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          CONFIG: ${{ inputs.config }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            python -m flight_bot.bot --schedule "$SCHEDULE"
          elif [ -n "$CONFIG" ] && [ "$CONFIG" != "all" ]; then
            python -m flight_bot.bot --config "configs/$CONFIG.yaml"
          else
            python -m flight_bot.bot
          fi

      - name: Save state
        # Save whatever state was produced even if one of the bots failed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update fare state"
          # main may have moved during the run; replay our commit on top,
          # keeping this run's state files if both changed them.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
