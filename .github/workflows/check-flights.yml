name: Check flights

on:
  schedule:
    - cron: "17 */8 * * *"   # every 8 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # to commit state.json back

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Always use the latest main, even when re-running an old run,
          # so we start from the newest state.json.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search fares
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m flight_bot.bot

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update fare state"
          # main may have moved during the run; replay our commit on top,
          # keeping this run's state.json if both changed it.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
